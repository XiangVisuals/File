<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArrowFlow — 图片箭头风格转换器</title>
<style>
:root{--bg:#080808;--panel:#111;--line:#242424;--text:#f5f5f5;--muted:#8d8d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:340px 1fr}
.sidebar{padding:28px 24px;border-right:1px solid var(--line);background:#0c0c0c;overflow:auto}
.logo{font-size:21px;font-weight:700;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.section{margin-top:28px}.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#777;margin:0 0 13px}
.drop{border:1px dashed #3b3b3b;border-radius:16px;padding:22px 15px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.drag{border-color:#aaa;background:#151515}.drop strong{display:block;font-size:14px}.drop span{display:block;color:#777;font-size:11px;margin-top:7px}
input[type=file]{display:none}.row{display:flex;justify-content:space-between;align-items:center;margin:15px 0 7px;font-size:12px}.value{color:#aaa;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#fff}
select,button{width:100%;background:#171717;color:#eee;border:1px solid #292929;border-radius:10px;padding:10px 11px;font-size:12px}
button{cursor:pointer}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{background:#f5f5f5;color:#080808;border-color:#f5f5f5;font-weight:600}
.hint{font-size:10px;line-height:1.6;color:#666;margin-top:18px}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:28px;min-width:0}
.canvas-wrap{width:min(100%,1100px);height:min(calc(100vh - 56px),900px);display:flex;align-items:center;justify-content:center;background:#050505;border-radius:18px;overflow:hidden}
canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#444;font-size:13px}
.badge{position:absolute;right:44px;top:44px;color:#666;font-size:10px;letter-spacing:.08em}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.stage{min-height:70vh}.canvas-wrap{height:70vh}.badge{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">ArrowFlow</div>
  <div class="sub">把照片转换成黑底白箭头艺术</div>

  <div class="section">
    <div class="drop" id="drop">
      <strong>拖入图片</strong>
      <span>或点击选择 JPG / PNG / WebP</span>
      <input id="file" type="file" accept="image/*">
    </div>
  </div>

  <div class="section">
    <h3>Field</h3>
    <select id="mode">
      <option value="gradient">图像梯度 · Image Gradient</option>
      <option value="radial">中心汇聚 · Radial</option>
      <option value="vortex">旋涡 · Vortex</option>
      <option value="up">垂直流 · Vertical</option>
    </select>

    <div class="row"><span>箭头密度</span><span class="value" id="densityV">30</span></div>
    <input id="density" type="range" min="12" max="60" value="30">

    <div class="row"><span>箭头长度</span><span class="value" id="sizeV">13</span></div>
    <input id="size" type="range" min="4" max="28" value="13">

    <div class="row"><span>方向强度</span><span class="value" id="strengthV">1.0</span></div>
    <input id="strength" type="range" min="0.2" max="2.5" step=".1" value="1">

    <div class="row"><span>明暗对比</span><span class="value" id="contrastV">1.4</span></div>
    <input id="contrast" type="range" min=".2" max="3" step=".1" value="1.4">

    <div class="row"><span>最小可见度</span><span class="value" id="thresholdV">0.08</span></div>
    <input id="threshold" type="range" min="0" max=".6" step=".01" value=".08">

    <div class="row"><span>采样平滑</span><span class="value" id="smoothV">3</span></div>
    <input id="smooth" type="range" min="0" max="8" step="1" value="3">

    <div class="row"><span>主体权重</span><span class="value" id="focusV">1.3</span></div>
    <input id="focus" type="range" min="0.3" max="2.5" step=".1" value="1.3">
  </div>

  <div class="section">
    <h3>Style</h3>
    <div class="row"><span>箭头粗细</span><span class="value" id="weightV">2.4</span></div>
    <input id="weight" type="range" min=".7" max="5" step=".1" value="2.4">
    <div class="row"><span>黑色背景</span><span class="value" id="bgV">100%</span></div>
    <input id="bg" type="range" min="0" max="100" value="100">
  </div>

  <div class="section buttons">
    <button id="random">随机参数</button>
    <button id="reset">重置</button>
    <button class="primary" id="download">导出 PNG</button>
    <button id="fullscreen">全屏预览</button>
  </div>
  <div class="hint">所有处理均在浏览器本地 Canvas 完成，图片不会上传服务器。新版加入了平滑采样、随机抖动、主体权重与自适应箭头尺寸，能明显减少“网格感”和方向噪声。建议使用人物、建筑、城市或具有明显明暗结构的照片。</div>
</aside>

<main class="stage">
  <div class="badge">LOCAL · GENERATIVE STYLE</div>
  <div class="canvas-wrap" id="wrap">
    <canvas id="canvas" width="900" height="1200"></canvas>
    <div class="empty" id="empty">上传一张图片开始</div>
  </div>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const c=$('canvas'),ctx=c.getContext('2d');
const src=document.createElement('canvas'),sctx=src.getContext('2d',{willReadFrequently:true});
let img=null, pixels=null, iw=0, ih=0;

const controls=['density','size','strength','contrast','threshold','smooth','jitter','focus','weight','bg'];
controls.forEach(id=>$(id).addEventListener('input',()=>{updateLabels(); render()}));
$('mode').addEventListener('change',render);

function updateLabels(){
  $('densityV').textContent=$('density').value;
  $('sizeV').textContent=$('size').value;
  $('strengthV').textContent=(+$('strength').value).toFixed(1);
  $('contrastV').textContent=(+$('contrast').value).toFixed(1);
  $('thresholdV').textContent=(+$('threshold').value).toFixed(2);
  $('smoothV').textContent=$('smooth').value;
  $('jitterV').textContent=$('jitter').value+'%';
  $('focusV').textContent=(+$('focus').value).toFixed(1);
  $('weightV').textContent=(+$('weight').value).toFixed(1);
  $('bgV').textContent=$('bg').value+'%';
}
updateLabels();

$('drop').onclick=()=> $('file').click();
$('file').onchange=e=>loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('drag')}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('drag')}));
$('drop').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

function loadFile(file){
 if(!file)return;
 const url=URL.createObjectURL(file), im=new Image();
 im.onload=()=>{
   img=im; iw=im.naturalWidth; ih=im.naturalHeight;
   const scale=Math.min(1,1600/Math.max(iw,ih));
   src.width=Math.max(1,Math.round(iw*scale)); src.height=Math.max(1,Math.round(ih*scale));
   sctx.drawImage(im,0,0,src.width,src.height);
   pixels=sctx.getImageData(0,0,src.width,src.height);
   c.width=src.width; c.height=src.height;
   $('empty').style.display='none'; render(); URL.revokeObjectURL(url);
 };
 im.src=url;
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function sample(x,y){
  x=clamp(x,0,src.width-1); y=clamp(y,0,src.height-1);
  const i=(Math.floor(y)*src.width+Math.floor(x))*4,p=pixels.data;
  return (0.2126*p[i]+0.7152*p[i+1]+0.0722*p[i+2])/255;
}
function smoothSample(x,y,r){
  if(r<=0)return sample(x,y);
  let sum=0,n=0,step=Math.max(1,r/2);
  for(let yy=-r;yy<=r;yy+=step) for(let xx=-r;xx<=r;xx+=step){sum+=sample(x+xx,y+yy);n++;}
  return sum/n;
}
function lum(x,y){return smoothSample(x,y,+$('smooth').value);}
function gradient(x,y){
  const e=Math.max(2,+$('smooth').value+1);
  const gx=lum(x+e,y)-lum(x-e,y), gy=lum(x,y+e)-lum(x,y-e);
  return [gx,gy];
}
function field(x,y){
  const nx=(x/src.width-.5)*2, ny=(y/src.height-.5)*2;
  const mode=$('mode').value, st=+$('strength').value;
  if(mode==='up') return [0,-1];
  if(mode==='radial'){
    const dx=-nx,dy=-ny,m=Math.hypot(dx,dy)||1; return [dx/m,dy/m];
  }
  if(mode==='vortex'){
    const dx=-ny,dy=nx,m=Math.hypot(dx,dy)||1; return [dx/m,dy/m];
  }
  let [gx,gy]=gradient(x,y);
  // 梯度的切线方向：比直接沿梯度更接近参考图的“流场”观感。
  let vx=-gy,vy=gx;
  const m=Math.hypot(vx,vy);
  if(m<0.0005) return [0,-1];
  return [vx/m,vy/m];
}
function arrow(x,y,len,ang,alpha){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.globalAlpha=clamp(alpha,0,1);ctx.strokeStyle='#fff';
  ctx.lineWidth=+$('weight').value;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-len*.5,0);ctx.lineTo(len*.5,0);ctx.stroke();
  const h=Math.max(2,len*.30);
  ctx.beginPath();ctx.moveTo(len*.5-h,-h*.72);ctx.lineTo(len*.5,0);ctx.lineTo(len*.5-h,h*.72);ctx.stroke();
  ctx.restore();
}
function render(){
  if(!pixels)return;
  const w=src.width,h=src.height;
  const bg=+$('bg').value/100;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=`rgb(${Math.round(5*bg)},${Math.round(5*bg)},${Math.round(5*bg)})`;
  ctx.fillRect(0,0,w,h);

  const density=+$('density').value;
  // 用短边控制采样尺度，避免不同画幅下箭头比例失真。
  const short=Math.min(w,h);
  const cell=clamp(short/density,7,55);
  const base=+$('size').value;
  const contrast=+$('contrast').value;
  const threshold=+$('threshold').value;
  const focus=+$('focus').value;
  const jitter=+$('jitter').value/100;

  // 二次采样 + 抖动：打破机械网格，同时保持整体规则性。
  // 亮度反相作为“主体权重”，暗部更容易形成粗箭头。
  for(let row=0, y=cell*.5; y<h; row++, y+=cell){
    for(let col=0, x=cell*.5; x<w; col++, x+=cell){
      const jx=(Math.random()-.5)*cell*jitter;
      const jy=(Math.random()-.5)*cell*jitter;
      const px=clamp(x+jx,0,w-1), py=clamp(y+jy,0,h-1);
      const l=lum(px,py);
      let v=Math.pow(clamp(1-l,0,1),contrast);
      v=Math.pow(v,1/Math.max(.2,focus));
      if(v<threshold) continue;

      // 局部梯度决定方向；弱纹理区域使用邻域平均方向，减少箭头抖动。
      let [vx,vy]=field(px,py);
      let angle=Math.atan2(vy,vx);
      if(!Number.isFinite(angle)) angle=-Math.PI/2;

      // 让主体区域同时控制尺寸、透明度和视觉重量。
      const len=base*(.30+v*1.70);
      const alpha=.16+Math.pow(v,.72)*.84;
      arrow(px,py,len,angle,alpha);
    }
  }
}
$('random').onclick=()=>{
 $('density').value=18+Math.floor(Math.random()*38);
 $('size').value=7+Math.floor(Math.random()*18);
 $('strength').value=(.5+Math.random()*1.7).toFixed(1);
 $('contrast').value=(.7+Math.random()*1.8).toFixed(1);
 $('threshold').value=(Math.random()*.25).toFixed(2);
 $('smooth').value=Math.floor(Math.random()*6);
 $('jitter').value=8+Math.floor(Math.random()*30);
 $('focus').value=(.8+Math.random()*1.4).toFixed(1);
 $('weight').value=(1.2+Math.random()*2.8).toFixed(1);
 $('mode').value=['gradient','radial','vortex','up'][Math.floor(Math.random()*4)];
 updateLabels();render();
};
$('reset').onclick=()=>{
 $('density').value=30;$('size').value=13;$('strength').value=1;$('contrast').value=1.4;
 $('threshold').value=.08;$('smooth').value=3;$('jitter').value=18;$('focus').value=1.3;$('weight').value=2.4;$('bg').value=100;$('mode').value='gradient';
 updateLabels();render();
};
$('download').onclick=async()=>{
 if(!pixels){ alert('请先上传图片'); return; }
 try{
   render();
   await new Promise(requestAnimationFrame);
   const blob=await new Promise((resolve,reject)=>{
     c.toBlob(b=>b?resolve(b):reject(new Error('PNG export failed')),'image/png',1);
   });
   const file=new File([blob],'arrowflow.png',{type:'image/png'});
   if(navigator.canShare && navigator.canShare({files:[file]})){
     try{ await navigator.share({files:[file],title:'ArrowFlow'}); return; }catch(e){}
   }
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url; a.download='arrowflow.png'; a.style.display='none';
   document.body.appendChild(a); a.click(); a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1500);
 }catch(err){
   console.error(err);
   alert('导出失败，请重试。');
 }
};
 const a=document.createElement('a');a.download='arrowflow.png';a.href=c.toDataURL('image/png');a.click();
};
$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
