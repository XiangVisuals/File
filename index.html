<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XIANG VISUALS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-subtle: #F7F7F7;
      --fg: #0A0A0A;
      --fg-secondary: #767676;
      --fg-muted: #BCBCBC;
      --hairline: #E6E6E6;
      --vermilion: #C82829;

      --font-brand: 'Cinzel', serif;
      --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
      --font-mono: 'JetBrains Mono', monospace;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-silky: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-curtain: cubic-bezier(0.76, 0, 0.24, 1);
    }

    html[data-theme="dark"] {
      --bg: #080808;
      --bg-subtle: #101010;
      --fg: #F2F2F2;
      --fg-secondary: #828282;
      --fg-muted: #383838;
      --hairline: #1E1E1E;
      --vermilion: #D93234;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-serif);
      transition: background-color 0.7s var(--ease-silky), color 0.7s var(--ease-silky);
    }

    @media (pointer: fine) {
      * { cursor: none !important; }
    }

    /* 胶片微噪点层 */
    .film-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* 克制的几何开场：只动画 transform / opacity，避免移动端大面积重绘 */
    .kinetic-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      z-index: 300;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity .42s var(--ease-silky), visibility 0s linear;
    }
    .kinetic-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .42s var(--ease-silky), visibility 0s linear .42s;
    }
    .loader-core {
      width: min(240px, 62vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .loader-glyph {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .loader-glyph span {
      display: block;
      width: 2px;
      height: var(--bar-height, 28px);
      background: var(--fg);
      transform: scaleY(.12);
      transform-origin: center;
      opacity: .35;
      animation: loaderBar .78s var(--ease-silky) infinite alternate;
      animation-delay: var(--bar-delay, 0s);
    }
    .loader-glyph span:nth-child(1) { --bar-height: 17px; --bar-delay: -.24s; }
    .loader-glyph span:nth-child(2) { --bar-height: 31px; --bar-delay: -.12s; }
    .loader-glyph span:nth-child(3) { --bar-height: 42px; --bar-delay: 0s; }
    .loader-glyph span:nth-child(4) { --bar-height: 31px; --bar-delay: -.12s; }
    .loader-glyph span:nth-child(5) { --bar-height: 17px; --bar-delay: -.24s; }
    .loader-wordmark {
      font-family: var(--font-brand);
      font-size: 10px;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .loader-wordmark i {
      font-style: normal;
      color: var(--fg-secondary);
    }
    .loader-track {
      width: 100%;
      height: 1px;
      background: var(--hairline);
      overflow: hidden;
    }
    .loader-track span {
      display: block;
      height: 100%;
      width: 34%;
      background: var(--fg);
      animation: loaderTrack .9s var(--ease-silky) infinite;
    }
    .loader-caption {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--fg-secondary);
    }
    @keyframes loaderBar {
      from { transform: scaleY(.12); opacity: .3; }
      to { transform: scaleY(1); opacity: 1; }
    }
    @keyframes loaderTrack {
      from { transform: translateX(-120%); }
      to { transform: translateX(320%); }
    }

        /* 自定义磁吸反色光标 */
    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background: #FFFFFF;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      transition: width 0.35s var(--ease-out), height 0.35s var(--ease-out), background-color 0.35s var(--ease-out), border 0.35s var(--ease-out);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 2px;
      color: #000000;
      overflow: hidden;
    }
    .custom-cursor.is-hover {
      width: 44px;
      height: 44px;
    }
    .custom-cursor.is-slice {
      width: 68px;
      height: 68px;
    }
    @media (pointer: coarse) {
      .custom-cursor { display: none; }
    }

    /* 建筑画廊主骨架 */
    .architectural-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 36px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 顶部极简横梁 */
    .top-beam {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--hairline);
    }

    .brand-mark {
      font-family: var(--font-brand);
      font-size: 13px;
      letter-spacing: 5px;
      color: var(--fg);
      text-decoration: none;
      font-weight: 400;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 32px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .channel-trigger {
      background: none;
      border: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }

    .signal-beacon {
      width: 5px;
      height: 5px;
      background: var(--fg-muted);
      transition: background-color 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
    }
    .signal-beacon.active {
      background: var(--vermilion);
      box-shadow: 0 0 10px var(--vermilion);
    }

    .theme-dot-btn {
      background: none;
      border: none;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-dot-btn::after {
      content: '';
      width: 8px;
      height: 8px;
      border: 1px solid var(--fg);
      background: var(--fg);
      transition: transform 0.4s var(--ease-out);
    }
    .theme-dot-btn:hover::after {
      transform: scale(1.35);
    }

    /* 中央主舞台（光学取景框 + 声呐 Canvas + 动态手风琴切片） */
    .center-stage {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 24px 0;
    }

    #sonarCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 两侧竖排建筑标尺 */
    .side-pillar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 3.5px;
      color: var(--fg-muted);
      z-index: 5;
      pointer-events: none;
    }
    .side-pillar.left { left: 0; }
    .side-pillar.right { right: 0; }

    /* 待机静谧中心视窗 */
    .idle-monolith {
      position: relative;
      z-index: 5;
      width: min(44vw, 520px);
      height: min(56vh, 460px);
      border: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s var(--ease-silky), transform 0.6s var(--ease-silky), border-color 0.4s var(--ease-out);
    }

    .center-stage.drag-over .idle-monolith,
    .center-stage.drag-over .slice-item {
      border-color: var(--vermilion);
    }

    /* 四角精密准星 */
    .reticle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--fg);
      border-style: solid;
      border-width: 0;
      transition: width 0.4s var(--ease-out), height 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    }
    .r-tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
    .r-tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
    .r-bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
    .r-br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }

    .idle-title {
      font-family: var(--font-serif);
      font-weight: 200;
      font-size: clamp(24px, 2.8vw, 36px);
      letter-spacing: 8px;
      color: var(--fg);
      margin-right: -8px;
      margin-bottom: 16px;
    }

    .idle-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--fg-secondary);
    }

    /* 动态手风琴切片容器（当有设备接入时展现） */
    .kinetic-strip {
      position: relative;
      z-index: 10;
      width: min(78vw, 1080px);
      height: min(64vh, 540px);
      display: none;
      align-items: stretch;
      border-left: 1px solid var(--hairline);
    }
    .kinetic-strip.has-peers {
      display: flex;
    }

    .slice-item {
      --peer-accent-base: #7C7C7C;
      --peer-accent: var(--peer-accent-base);
      --peer-tint: color-mix(in srgb, var(--peer-accent) 7%, var(--bg));
      position: relative;
      flex: 1 1 0%;
      min-width: 0;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      border-right: 1px solid var(--hairline);
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px 24px;
      isolation: isolate;
      animation: peerReveal .45s var(--ease-silky) both;
      transition: background-color .35s var(--ease-silky), border-color .3s var(--ease-out), flex-grow .18s linear;
    }
    .slice-item::after {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(145deg, var(--peer-tint), transparent 72%);
      opacity: .8;
      pointer-events: none;
    }
    .slice-item:nth-child(2) { animation-delay: .035s; }
    .slice-item:nth-child(3) { animation-delay: .07s; }
    .slice-item:nth-child(4) { animation-delay: .105s; }
    @keyframes peerReveal {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slice-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--bg-subtle);
      opacity: 0;
      transition: opacity 0.5s var(--ease-silky);
      pointer-events: none;
    }

    .slice-item.is-focused::before {
      opacity: 1;
    }

    .slice-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--fg-secondary);
    }
    .peer-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .peer-mark {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--peer-accent) 42%, var(--hairline));
      background: var(--peer-tint);
      color: var(--peer-accent);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0;
    }
    .peer-labels { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .peer-brand { color: var(--peer-accent); font-size: 10px; letter-spacing: 1.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .peer-number { color: var(--fg-muted); font-size: 8px; letter-spacing: 1.2px; }
    .slice-status-dot {
      flex: 0 0 5px;
      width: 5px;
      height: 5px;
      margin-top: 5px;
      background: var(--peer-accent);
      box-shadow: 0 0 8px color-mix(in srgb, var(--peer-accent) 46%, transparent);
    }
    html[data-theme="dark"] .slice-item { --peer-accent: color-mix(in srgb, var(--peer-accent-base) 58%, white); }
    .slice-item.is-focused { border-color: color-mix(in srgb, var(--peer-accent) 60%, var(--hairline)); }
    .slice-item.is-focused::before { opacity: .5; }
    .slice-item.is-focused .slice-status-dot { transform: scale(1.2); }

    /* 切片中央建筑排版 */
    .slice-body {
      position: relative;
      z-index: 2;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slice-name {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(22px, 2.6vw, 36px);
      letter-spacing: 1px;
      line-height: 1.25;
      color: var(--fg);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: transform .35s var(--ease-out);
    }
    .slice-type {
      color: var(--fg-secondary);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .slice-actions { display: flex; align-items: center; gap: 12px; }
    .slice-action-link {
      min-height: 30px;
      padding: 5px 0;
      white-space: nowrap;
      color: var(--fg);
    }
    .slice-action-link.primary { color: var(--peer-accent); border-bottom: 1px solid color-mix(in srgb, var(--peer-accent) 45%, transparent); }
    .slice-action-link:focus-visible, button:focus-visible, a:focus-visible {
      outline: 1px solid var(--peer-accent, var(--fg));
      outline-offset: 4px;
    }

    .slice-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--fg-secondary);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.45s var(--ease-out), transform 0.45s var(--ease-out);
    }

    .slice-item.is-focused .slice-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .slice-footer {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--fg-secondary);
    }

    .slice-action-link {
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--fg-secondary);
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.3s, border-color 0.3s;
    }
    .slice-action-link:hover {
      color: var(--fg);
      border-color: var(--fg);
    }

    /* 切片底部朱砂红传输流体线 */
    .slice-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--peer-accent, var(--vermilion));
      z-index: 5;
      transition: width 0.18s linear;
    }

    /* 底部 EXIF 铭牌栏 */
    .bottom-beam {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--fg-secondary);
    }

    .identity-btn {
      background: none;
      border: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--hairline);
      transition: border-color 0.3s var(--ease-out);
    }
    .identity-btn:hover {
      border-color: var(--fg);
    }

    /* 极简画廊级弹窗（无外框阴影，纯1px结构线与背景微模糊） */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, .84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .28s var(--ease-out), visibility .28s;
      padding: 24px;
      overscroll-behavior: contain;
    }
    html[data-theme="dark"] .sheet-overlay {
      background: rgba(8, 8, 8, 0.88);
    }
    .sheet-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .sheet-dialog {
      width: 100%;
      max-width: 440px;
      background: var(--bg);
      border: 1px solid var(--fg);
      padding: 40px 36px;
      position: relative;
      transform: translateY(12px);
      max-height: calc(100dvh - 48px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      transition: transform .28s var(--ease-out);
    }
    .sheet-overlay.active .sheet-dialog { transform: translateY(0); }

    .sheet-index {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--vermilion);
      margin-bottom: 12px;
    }

    .sheet-heading {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--fg);
      margin-bottom: 28px;
    }

    .sheet-preview-img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border: 1px solid var(--hairline);
      background: var(--bg-subtle);
      margin-bottom: 20px;
      display: none;
    }

    .sheet-specs {
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      padding: 16px 0;
      margin-bottom: 28px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spec-line {
      display: flex;
      justify-content: space-between;
      color: var(--fg-secondary);
    }
    .spec-line span:last-child {
      color: var(--fg);
      text-align: right;
      max-width: 72%;
      word-break: break-all;
    }

    .minimal-input, .minimal-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--fg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 1px;
      padding: 12px 0;
      margin-bottom: 32px;
      outline: none;
    }
    .minimal-textarea {
      border: 1px solid var(--hairline);
      padding: 14px;
      min-height: 110px;
      font-family: var(--font-serif);
      font-size: 16px;
      letter-spacing: 1px;
      resize: none;
      transition: border-color 0.3s;
    }
    .minimal-textarea:focus {
      border-color: var(--fg);
    }

    .sheet-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .slab-btn {
      height: 42px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 3px;
      transition: all 0.3s var(--ease-out);
    }
    .slab-btn:hover {
      border-color: var(--fg);
    }
    .slab-btn.solid {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    .slab-btn.solid:hover {
      opacity: 0.85;
    }

    /* 顶部极简浮现通知 */
    .whisper-toast {
      position: fixed;
      top: 36px;
      left: 50%;
      transform: translate(-50%, -14px);
      background: var(--fg);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2.5px;
      padding: 9px 22px;
      z-index: 400;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s var(--ease-out);
    }
    .whisper-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 768px) {
      html, body { width: 100%; height: 100%; }
      .architectural-frame {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        padding: calc(14px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
      }
      .top-beam { padding-bottom: 13px; gap: 14px; }
      .brand-mark { font-size: 11px; letter-spacing: 2.5px; }
      .top-meta { gap: 12px; }
      .theme-dot-btn { min-width: 36px; min-height: 36px; }
      .channel-trigger { gap: 8px; min-height: 36px; font-size: 10px; letter-spacing: 1.5px; }
      .center-stage { margin: 14px 0; min-height: 0; overflow: hidden; }
      .side-pillar { display: none; }
      .idle-monolith { width: 100%; height: min(43vh, 390px); min-height: 230px; }
      .idle-title { font-size: clamp(21px, 6vw, 29px); letter-spacing: 4px; margin-right: -4px; }
      .idle-sub { font-size: 9px; letter-spacing: 2px; }
      .kinetic-strip.has-peers {
        width: 100%;
        height: 100%;
        max-height: 100%;
        flex: 1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(178px, auto);
        align-content: start;
        align-items: stretch;
        gap: 9px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 1px 1px 8px;
        border: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--hairline) transparent;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .slice-item {
        min-width: 0;
        min-height: 178px;
        padding: 13px 12px 10px;
        border: 1px solid var(--hairline);
        border-top: 2px solid var(--peer-accent);
        flex: none !important;
        gap: 12px;
      }
      .slice-header { gap: 5px; }
      .peer-identity { gap: 7px; }
      .peer-mark { flex-basis: 28px; width: 28px; height: 28px; font-size: 9px; }
      .peer-brand { font-size: 9px; letter-spacing: .7px; }
      .peer-number { font-size: 7px; letter-spacing: .8px; }
      .slice-body { gap: 7px; margin: 0; }
      .slice-name { font-size: clamp(17px, 4.5vw, 22px); line-height: 1.25; letter-spacing: .2px; }
      .slice-hint { opacity: 1; transform: none; font-size: 8px; letter-spacing: .7px; line-height: 1.4; }
      .slice-footer { display: flex; flex-direction: column; align-items: stretch; gap: 7px; font-size: 8px; letter-spacing: .5px; }
      .slice-type { font-size: 8px; letter-spacing: .6px; }
      .slice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .slice-action-link {
        min-width: 0;
        min-height: 40px;
        padding: 7px 0 5px;
        border-bottom: 1px solid var(--hairline);
        font-size: 9px;
        letter-spacing: .2px;
        text-align: center;
      }
      .slice-progress { height: 2px; }
      .bottom-beam { padding-top: 13px; font-size: 9px; letter-spacing: 1px; gap: 12px; }
      .identity-btn { min-height: 36px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; letter-spacing: 1px; }
      .sheet-overlay { align-items: flex-end; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
      .sheet-dialog {
        max-width: none;
        width: 100%;
        max-height: calc(100dvh - 20px - env(safe-area-inset-top));
        padding: 28px 22px calc(22px + env(safe-area-inset-bottom));
        border-color: var(--hairline);
      }
      .sheet-heading { font-size: 24px; margin-bottom: 22px; }
      .sheet-specs { font-size: 10px; margin-bottom: 22px; }
      .sheet-controls { gap: 10px; }
      .slab-btn { min-height: 46px; height: auto; font-size: 10px; letter-spacing: 1.5px; }
      .minimal-input, .minimal-textarea { font-size: 16px; margin-bottom: 24px; }
      .minimal-textarea { min-height: 120px; }
      .whisper-toast { top: calc(16px + env(safe-area-inset-top)); width: max-content; max-width: calc(100vw - 32px); text-align: center; }
    }
    @media (max-width: 380px) {
      .architectural-frame { padding-left: 12px; padding-right: 12px; }
      .kinetic-strip.has-peers { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
      .slice-item { min-height: 160px; }
      .slice-footer { flex-direction: row; align-items: center; justify-content: space-between; }
      .slice-actions { display: flex; gap: 12px; }
      .slice-action-link { min-height: 30px; font-size: 9px; }
    }
    @media (pointer: coarse) {
      .custom-cursor { display: none !important; }
      .slice-item { cursor: default; }
      .slice-action-link, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

</head>
<body>

  <div class="film-grain"></div>

  <!-- 1. 轻量几何开场加载器 -->
  <div class="kinetic-loader" id="kineticLoader" role="status" aria-label="正在初始化设备场域">
    <div class="loader-core">
      <div class="loader-glyph" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="loader-wordmark">XIANG VISUALS <i>/ DROP</i></div>
      <div class="loader-track" aria-hidden="true"><span></span></div>

    </div>
  </div>

  <!-- 2. 磁吸差值光标 -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- 3. 建筑网格主视口 -->
  <div class="architectural-frame">
    <header class="top-beam">
      <a href="https://xiangvisuals.com/" target="_blank" rel="noopener" class="brand-mark" data-cursor="hover">XIANG VISUALS</a>
      <div class="top-meta">
        <button class="channel-trigger" id="roomTrigger" data-cursor="hover" title="配对频道">

    <main class="center-stage" id="centerStage">
      <canvas id="sonarCanvas"></canvas>

      <div class="side-pillar left">OPTICAL P2P FIELD</div>
      <div class="side-pillar right" id="coordPillar">38.9140° N, 121.6147° E</div>

      <!-- 静谧待机取景器（无任何虚假节点） -->

        <div class="reticle r-tl"></div>
        <div class="reticle r-tr"></div>
        <div class="reticle r-bl"></div>
        <div class="reticle r-br"></div>
        <h1 class="idle-title">静候场域接入</h1>
        <p class="idle-sub" id="idleSubText">CH // 0411</p>
      </div>

      <!-- 阻尼手风琴画廊切片（真实设备接入后浮现） -->
      <div class="kinetic-strip" id="kineticStrip"></div>
    </main>

    <footer class="bottom-beam">
      <button class="identity-btn" id="selfIdentityBtn" data-cursor="hover">NODE</button>
      <span id="peerCountIndicator">00 ONLINE</span>
    </footer>
  </div>

  <input type="file" id="hiddenFileInput" multiple style="display: none;" />

  <!-- 接收投递确认单 -->
  <div class="sheet-overlay" id="receiveSheet">
    <div class="sheet-dialog">
      <div class="reticle r-tl"></div>
      <div class="reticle r-tr"></div>
      <div class="reticle r-bl"></div>
      <div class="reticle r-br"></div>
      <div class="sheet-index" id="recIndex">INCOMING</div>
      <h2 class="sheet-heading" id="recHeading">收到投递</h2>
      <img class="sheet-preview-img" id="recImg" alt="Preview" />
      <div class="sheet-specs" id="recSpecs"></div>
      <div class="sheet-controls">
        <button class="slab-btn" id="recDismissBtn" data-cursor="hover">忽略</button>
        <button class="slab-btn solid" id="recSaveBtn" data-cursor="hover">保存</button>
      </div>
    </div>
  </div>

  <!-- 极简输入面板（修改频道 / 修改本机名 / 投递文字） -->
  <div class="sheet-overlay" id="promptSheet">
    <div class="sheet-dialog">
      <div class="reticle r-tl"></div>
      <div class="reticle r-tr"></div>
      <div class="reticle r-bl"></div>
      <div class="reticle r-br"></div>
      <div class="sheet-index" id="prmIndex">CONFIG</div>
      <h2 class="sheet-heading" id="prmHeading">参数设定</h2>
      <input type="text" class="minimal-input" id="prmInput" maxlength="28" autocomplete="off" placeholder="例如：祥的 iPhone / 工作 Mac" style="display: none;" />
      <textarea class="minimal-textarea" id="prmTextarea" placeholder="输入内容..."></textarea>
      <div class="sheet-controls">
        <button class="slab-btn" id="prmCancelBtn" data-cursor="hover">取消</button>
        <button class="slab-btn solid" id="prmOkBtn" data-cursor="hover">确认</button>
      </div>
    </div>
  </div>

  <div class="whisper-toast" id="whisperToast"></div>

  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script>
    (function () {
      // ================== 1. 轻量开场加载器 ==================
      const loader = document.getElementById('kineticLoader');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // 不等待 MQTT / WebRTC：网络不可用时页面也会准时进入可用状态。
      window.setTimeout(() => loader.classList.add('done'), reduceMotion ? 120 : 620);

      // ================== 2. 磁吸反色光标引擎 ==================
      const cursor = document.getElementById('customCursor');
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let curX = mouseX, curY = mouseY;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        const target = e.target;
        if (target.closest('.slice-item')) {
          cursor.className = 'custom-cursor is-slice';
        } else if (target.closest('[data-cursor="hover"]') || target.closest('button') || target.closest('a')) {
          cursor.className = 'custom-cursor is-hover';
        } else {
          cursor.className = 'custom-cursor';
        }
      });

      function tickCursor() {
        curX += (mouseX - curX) * 0.38;
        curY += (mouseY - curY) * 0.38;
        cursor.style.transform = `translate3d(${curX}px, ${curY}px, 0) translate(-50%, -50%)`;
        requestAnimationFrame(tickCursor);
      }
      if (window.matchMedia('(pointer: fine)').matches) tickCursor();

      // ================== 3. 轻量光学声呐背景 ==================
      const canvas = document.getElementById('sonarCanvas');
      const ctx = canvas.getContext('2d');
      let cw = 0, ch = 0, sonarPhase = 0;

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, window.matchMedia('(pointer: coarse)').matches ? 1.35 : 2);
        cw = rect.width;
        ch = rect.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let sonarLastFrame = 0;
      function renderSonar(now = 0) {
        if (document.visibilityState === 'hidden') {
          if (!reduceMotion) requestAnimationFrame(renderSonar);
          return;
        }
        const frameInterval = window.matchMedia('(pointer: coarse)').matches ? 1000 / 30 : 0;
        if (frameInterval && now - sonarLastFrame < frameInterval) {
          requestAnimationFrame(renderSonar);
          return;
        }
        sonarLastFrame = now;
        ctx.clearRect(0, 0, cw, ch);
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const strokeRGB = isDark ? '255, 255, 255' : '10, 10, 10';
        const cx = cw / 2;
        const cy = ch / 2;
        const maxR = Math.min(cw, ch) * 0.46;

        sonarPhase += window.matchMedia('(pointer: coarse)').matches ? 0.0018 : 0.0025;
        const ringCount = window.matchMedia('(pointer: coarse)').matches ? 2 : 3;
        for (let i = 0; i < ringCount; i++) {
          const p = (sonarPhase + i / ringCount) % 1;
          const r = p * maxR;
          const alpha = (1 - p) * (isDark ? 0.08 : 0.06);
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${strokeRGB}, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        if (!reduceMotion) requestAnimationFrame(renderSonar);
      }
      renderSonar();

      // ================== 4. 主题与基础工具 ==================
      const THEME_KEY = 'xv_drop_theme';
      const NAME_KEY = 'xv_drop_device_name';
      const ROOM_KEY = 'xv_drop_room_code';

      const root = document.documentElement;
      root.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'light');

      document.getElementById('themeToggle').addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
      });

      function whisper(msg) {
        const t = document.getElementById('whisperToast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2500);
      }

      function formatBytes(b) {
        if (!b) return '0 B';
        const u = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(b) / Math.log(1024));
        return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i];
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
      }

      // ================== 5. 二阶临界阻尼手风琴切片物理引擎 ==================
      const peers = new Map();
      let focusIndex = 0;
      let trackPos = 0;
      let trackVel = 0;
      let lastPhysicsTime = performance.now();

      const idleMonolith = document.getElementById('idleMonolith');
      const kineticStrip = document.getElementById('kineticStrip');
      const peerCountIndicator = document.getElementById('peerCountIndicator');
      const hiddenFileInput = document.getElementById('hiddenFileInput');
      let activeTargetPeerId = null;

      function syncStripDOM() {
        const list = Array.from(peers.values());
        peerCountIndicator.textContent = `${String(list.length).padStart(2, '0')} ONLINE`;

        if (list.length === 0) {
          idleMonolith.style.display = 'flex';
          kineticStrip.classList.remove('has-peers');
          kineticStrip.innerHTML = '';
          return;
        }

        idleMonolith.style.display = 'none';
        kineticStrip.classList.add('has-peers');
        if (focusIndex >= list.length) focusIndex = list.length - 1;

        kineticStrip.innerHTML = list.map((peer, idx) => {
          const num = String(idx + 1).padStart(2, '0');
          const profile = peer.profile || normalizeRemoteProfile(null, '', '');
          const accent = BRAND_STYLES[profile.brandKey]?.accent || BRAND_STYLES.generic.accent;
          const mark = BRAND_STYLES[profile.brandKey]?.mark || 'D';
          const browser = profile.browser || 'Browser';
          const deviceType = profile.deviceType || peer.kindLabel || 'DEVICE';
          return `
            <div class="slice-item ${idx === focusIndex ? 'is-focused' : ''}" data-peer-id="${escapeHtml(peer.id)}" data-idx="${idx}" style="--peer-accent-base:${accent};">
              <div class="slice-header">
                <div class="peer-identity">
                  <span class="peer-mark" aria-hidden="true">${escapeHtml(mark)}</span>
                  <div class="peer-labels">
                    <span class="peer-brand">${escapeHtml(profile.brandName || 'DEVICE')}</span>
                    <span class="peer-number">${num} / ${escapeHtml(deviceType)}</span>
                  </div>
                </div>
                <span class="slice-status-dot" title="ONLINE" aria-label="在线"></span>
              </div>
              <div class="slice-body">
                <div class="slice-name">${escapeHtml(peer.name)}</div>
                <div class="slice-hint">${escapeHtml(profile.model || deviceType)} · ${escapeHtml(browser)}</div>
              </div>
              <div class="slice-footer">
                <span class="slice-type">${escapeHtml(deviceType)} / ${escapeHtml(browser)}</span>
                <div class="slice-actions">
                  <button class="slice-action-link primary" data-file-trigger="${escapeHtml(peer.id)}" data-cursor="hover">选择文件</button>
                  <button class="slice-action-link" data-text-trigger="${escapeHtml(peer.id)}" data-cursor="hover">发送文字</button>
                </div>
              </div>
              <div class="slice-progress" id="prog_${escapeHtml(peer.id)}" style="width: ${peer.progress || 0}%"></div>
            </div>
          `;
        }).join('');

        kineticStrip.querySelectorAll('.slice-item').forEach(el => {
          const pid = el.getAttribute('data-peer-id');
          const idx = parseInt(el.getAttribute('data-idx'), 10);

          el.addEventListener('pointerenter', () => {
            if (window.matchMedia('(pointer: fine)').matches) {
              focusIndex = idx;
              updateFocusClass();
            }
          });

          el.addEventListener('click', (e) => {
            if (e.target.closest('[data-text-trigger]')) {
              e.stopPropagation();
              focusIndex = idx;
              updateFocusClass();
              openTextComposer(pid);
              return;
            }
            if (e.target.closest('[data-file-trigger]')) {
              e.stopPropagation();
              focusIndex = idx;
              updateFocusClass();
              activeTargetPeerId = pid;
              hiddenFileInput.value = '';
              hiddenFileInput.click();
              return;
            }
            focusIndex = idx;
            updateFocusClass();
            // 桌面端保留整张卡片点选文件；触屏端仅选中，避免误触立即弹出文件选择器。
            if (window.matchMedia('(pointer: coarse)').matches) return;
            activeTargetPeerId = pid;
            hiddenFileInput.value = '';
            hiddenFileInput.click();
          });

          el.addEventListener('contextmenu', (e) => {
            if (window.matchMedia('(pointer: coarse)').matches) return;
            e.preventDefault();
            openTextComposer(pid);
          });

          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            focusIndex = idx;
            updateFocusClass();
          });

          el.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('centerStage').classList.remove('drag-over');
            if (e.dataTransfer.files?.length) {
              sendFilesToPeer(pid, Array.from(e.dataTransfer.files));
            }
          });
        });
      }

      function updateFocusClass() {
        const items = kineticStrip.querySelectorAll('.slice-item');
        items.forEach((item, i) => {
          item.classList.toggle('is-focused', i === focusIndex);
        });
      }

      // 临界阻尼 ODE (zeta = 1.0, omega = 6.2) 驱动连续切片权重
      function tickStripPhysics(now) {
        const dt = Math.min((now - lastPhysicsTime) / 1000, 0.064);
        lastPhysicsTime = now;

        const omega = 6.2;
        const d0 = trackPos - focusIndex;
        const v0 = trackVel;
        const expTerm = Math.exp(-omega * dt);
        const nextD = (d0 + (v0 + omega * d0) * dt) * expTerm;
        trackVel = (v0 - omega * (v0 + omega * d0) * dt) * expTerm;
        trackPos = focusIndex + nextD;

        const slices = kineticStrip.querySelectorAll('.slice-item');
        if (slices.length > 1) {
          slices.forEach((slice, i) => {
            const dist = Math.abs(i - trackPos);
            const peak = dist < 1 ? 0.5 * (1 + Math.cos(Math.PI * dist)) : 0;
            const weight = 1 + peak * 2.4;
            slice.style.flexGrow = weight.toFixed(4);
          });
        }
        requestAnimationFrame(tickStripPhysics);
      }
      requestAnimationFrame(tickStripPhysics);

      // ================== 6. 本机身份与双通道零配置信令 ==================
      const myId = 'xv_' + Math.random().toString(36).substring(2, 9);
      const ua = navigator.userAgent || '';
      const NAME_CUSTOM_KEY = 'xv_drop_device_name_custom';

      const BRAND_STYLES = {
        apple:    { label: 'APPLE',    accent: '#007AFF', mark: 'A' },
        samsung:  { label: 'SAMSUNG',  accent: '#1428A0', mark: 'S' },
        google:   { label: 'GOOGLE',   accent: '#4285F4', mark: 'G' },
        xiaomi:   { label: 'XIAOMI',   accent: '#FF6900', mark: 'Mi' },
        huawei:   { label: 'HUAWEI',   accent: '#D93025', mark: 'H' },
        honor:    { label: 'HONOR',    accent: '#0072CE', mark: 'Ho' },
        oneplus:  { label: 'ONEPLUS',  accent: '#F5010C', mark: '1+' },
        oppo:     { label: 'OPPO',     accent: '#00A862', mark: 'O' },
        vivo:     { label: 'VIVO',     accent: '#415FFF', mark: 'V' },
        realme:   { label: 'REALME',   accent: '#D6A900', mark: 'R' },
        motorola: { label: 'MOTOROLA', accent: '#2F6BFF', mark: 'M' },
        sony:     { label: 'SONY',     accent: '#777777', mark: 'S' },
        asus:     { label: 'ASUS',     accent: '#00A5E5', mark: 'AS' },
        nothing:  { label: 'NOTHING',  accent: '#858585', mark: 'N' },
        windows:  { label: 'WINDOWS',  accent: '#0078D4', mark: 'W' },
        linux:    { label: 'LINUX',    accent: '#E95420', mark: 'L' },
        chromeos: { label: 'CHROMEOS', accent: '#4285F4', mark: 'C' },
        generic:  { label: 'DEVICE',   accent: '#858585', mark: 'D' }
      };

      function detectBrowser(userAgent) {
        if (/Edg\//i.test(userAgent)) return 'Edge';
        if (/SamsungBrowser/i.test(userAgent)) return 'Samsung Internet';
        if (/OPR\//i.test(userAgent) || /Opera/i.test(userAgent)) return 'Opera';
        if (/Firefox\//i.test(userAgent) || /FxiOS\//i.test(userAgent)) return 'Firefox';
        if (/CriOS\//i.test(userAgent)) return 'Chrome';
        if (/Chrome\//i.test(userAgent) && !/Edg\//i.test(userAgent)) return 'Chrome';
        if (/Safari\//i.test(userAgent)) return 'Safari';
        return 'Browser';
      }

      function parseAndroidModel(userAgent) {
        const match = userAgent.match(/Android\s+[^;]+;\s*([^;)]+?)(?:\s+Build\/|[;)])/i);
        if (!match) return '';
        return match[1].replace(/;.*$/, '').trim();
      }

      function getBrandKey(userAgent, platform, model) {
        const haystack = `${model || ''} ${userAgent || ''} ${platform || ''}`;
        if (/iPhone|iPad|iPod|Macintosh|MacIntel|macOS|Mac OS/i.test(haystack)) return 'apple';
        if (/SM-[A-Z0-9]+|Samsung|Galaxy/i.test(haystack)) return 'samsung';
        if (/Pixel/i.test(haystack)) return 'google';
        if (/Xiaomi|Redmi|POCO|Mi\s?\d|MIX\s?Fold/i.test(haystack)) return 'xiaomi';
        if (/HUAWEI|Huawei/i.test(haystack)) return 'huawei';
        if (/HONOR/i.test(haystack)) return 'honor';
        if (/OnePlus|ONEPLUS/i.test(haystack)) return 'oneplus';
        if (/OPPO|CPH[0-9]{3,}/i.test(haystack)) return 'oppo';
        if (/vivo|iQOO|V[0-9]{4}[A-Z]?/i.test(haystack)) return 'vivo';
        if (/realme|RMX[0-9]+/i.test(haystack)) return 'realme';
        if (/motorola|Moto\s/i.test(haystack)) return 'motorola';
        if (/Xperia|Sony/i.test(haystack)) return 'sony';
        if (/ASUS|ROG Phone|Zenfone/i.test(haystack)) return 'asus';
        if (/Nothing Phone/i.test(haystack)) return 'nothing';
        if (/CrOS|Chrome OS/i.test(haystack)) return 'chromeos';
        if (/Windows|Win32|Win64/i.test(haystack)) return 'windows';
        if (/Android/i.test(haystack)) return 'generic';
        if (/Linux|X11|Ubuntu/i.test(haystack)) return 'linux';
        return 'generic';
      }

      function inferDeviceProfile(modelHint = '', platformHint = '') {
        const platform = platformHint || navigator.userAgentData?.platform || navigator.platform || '';
        const isIPad = /iPad/i.test(ua) || (/Macintosh|MacIntel/i.test(`${ua} ${platform}`) && (navigator.maxTouchPoints || 0) > 1);
        const isIPhone = /iPhone|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua) || /Android/i.test(platform);
        const isTablet = isIPad || /Tablet/i.test(ua) || (isAndroid && !/Mobile/i.test(ua));
        let deviceType = 'DESKTOP';
        if (isIPhone || (isAndroid && !isTablet) || /Mobile/i.test(ua)) deviceType = 'PHONE';
        else if (isTablet) deviceType = 'TABLET';

        let model = String(modelHint || (isAndroid ? parseAndroidModel(ua) : '')).trim();
        let brandKey = getBrandKey(ua, platform, model);
        let modelLabel = '';
        if (brandKey === 'apple') {
          modelLabel = isIPad ? 'iPad' : isIPhone ? 'iPhone' : /Macintosh|MacIntel|macOS|Mac OS/i.test(`${ua} ${platform}`) ? 'Mac' : 'Apple Device';
          if (model && /iPhone|iPad/i.test(model)) modelLabel = model;
        } else if (brandKey === 'samsung') {
          modelLabel = /Galaxy/i.test(model) ? model : (deviceType === 'PHONE' ? 'Galaxy Phone' : deviceType === 'TABLET' ? 'Galaxy Tab' : 'Galaxy Book');
        } else if (brandKey === 'google') {
          modelLabel = /Pixel/i.test(model) ? model : (deviceType === 'PHONE' ? 'Pixel Phone' : deviceType === 'TABLET' ? 'Pixel Tablet' : 'Chromebook');
        } else if (brandKey === 'xiaomi') {
          modelLabel = /Xiaomi|Redmi|POCO|MIX/i.test(model) ? model : 'Xiaomi Phone';
        } else if (['huawei','honor','oneplus','oppo','vivo','realme','motorola','sony','asus','nothing'].includes(brandKey)) {
          const cleanModel = model && !/^[A-Z]{2,}[-_]?[A-Z0-9]{4,}$/i.test(model) ? model : '';
          const genericLabels = { huawei: 'Huawei Phone', honor: 'HONOR Phone', oneplus: 'OnePlus Phone', oppo: 'OPPO Phone', vivo: 'vivo Phone', realme: 'realme Phone', motorola: 'Motorola Phone', sony: 'Xperia', asus: 'ASUS Device', nothing: 'Nothing Phone' };
          modelLabel = cleanModel || genericLabels[brandKey] || 'Android Device';
        } else if (brandKey === 'windows') {
          modelLabel = deviceType === 'DESKTOP' ? 'Windows PC' : 'Windows Device';
        } else if (brandKey === 'linux') {
          modelLabel = deviceType === 'DESKTOP' ? 'Linux PC' : 'Linux Device';
        } else if (brandKey === 'chromeos') {
          modelLabel = 'Chromebook';
        } else {
          modelLabel = isAndroid ? 'Android Device' : deviceType === 'DESKTOP' ? 'Computer' : deviceType === 'TABLET' ? 'Tablet' : 'Mobile Device';
        }
        const browser = detectBrowser(ua);
        const theme = BRAND_STYLES[brandKey] || BRAND_STYLES.generic;
        return { brandKey, brandName: theme.label, accent: theme.accent, monogram: theme.mark, deviceType, kindLabel: deviceType, browser, model: modelLabel, platform };
      }

      function normalizeRemoteProfile(raw, userAgent, platform) {
        // 对旧版本客户端提供兼容映射；未知设备使用中性色，不借用本机型号。
        const key = raw && Object.prototype.hasOwnProperty.call(BRAND_STYLES, raw.brandKey) ? raw.brandKey : getBrandKey(userAgent || '', platform || '', '');
        const theme = BRAND_STYLES[key] || BRAND_STYLES.generic;
        const allowedTypes = ['PHONE', 'TABLET', 'DESKTOP'];
        let deviceType = raw && allowedTypes.includes(raw.deviceType) ? raw.deviceType : (raw && allowedTypes.includes(raw.kindLabel) ? raw.kindLabel : 'DESKTOP');
        if (raw && raw.kindLabel === 'MOBILE') deviceType = 'PHONE';
        const allowedBrowsers = ['Safari', 'Chrome', 'Edge', 'Firefox', 'Opera', 'Samsung Internet', 'Browser'];
        const browser = raw && allowedBrowsers.includes(raw.browser) ? raw.browser : 'Browser';
        const fallbackModel = deviceType === 'PHONE' ? 'Mobile Device' : deviceType === 'TABLET' ? 'Tablet' : 'Computer';
        const model = raw && typeof raw.model === 'string' ? raw.model.slice(0, 64) : fallbackModel;
        return { brandKey: key, brandName: theme.label, accent: theme.accent, monogram: theme.mark, deviceType, kindLabel: deviceType, browser, model };
      }

      function formatDeviceName(profile) {
        const model = profile.model || 'Device';
        const browser = profile.browser || 'Browser';
        const prefixes = { apple: 'Apple ', samsung: 'Samsung ', google: 'Google ', xiaomi: '', huawei: 'Huawei ', honor: 'HONOR ', oneplus: 'OnePlus ', oppo: 'OPPO ', vivo: 'vivo ', realme: 'realme ', motorola: 'Motorola ', sony: 'Sony ', asus: 'ASUS ', nothing: 'Nothing ', windows: '', linux: '', chromeos: '', generic: '' };
        const brandedStarts = {
          apple: /^Apple\b/i, samsung: /^Samsung\b/i, google: /^Google\b/i,
          xiaomi: /^(Xiaomi|Redmi|POCO|MIX)\b/i, huawei: /^Huawei\b/i, honor: /^HONOR\b/i,
          oneplus: /^OnePlus\b/i, oppo: /^OPPO\b/i, vivo: /^vivo\b/i, realme: /^realme\b/i,
          motorola: /^Motorola\b/i, sony: /^(Sony|Xperia)\b/i, asus: /^ASUS\b/i, nothing: /^Nothing\b/i
        };
        let label = model;
        const prefix = prefixes[profile.brandKey] ?? '';
        const alreadyBranded = (brandedStarts[profile.brandKey] || /^(Windows|Linux|Chromebook)\b/i).test(model);
        if (prefix && !alreadyBranded) label = prefix + model;
        return `${label} · ${browser}`.slice(0, 48);
      }

      let deviceProfile = inferDeviceProfile();
      const savedName = localStorage.getItem(NAME_KEY) || '';
      const legacyAutoName = /^(Mac|iPhone|iPad|Android|PC|Node)\s+\d{2}$/i.test(savedName);
      let isCustomDeviceName = localStorage.getItem(NAME_CUSTOM_KEY) === '1' || (!!savedName && !legacyAutoName && localStorage.getItem(NAME_CUSTOM_KEY) !== '0');
      let myName = (isCustomDeviceName && savedName) ? savedName.slice(0, 28) : formatDeviceName(deviceProfile);
      if (!myName || myName === 'Computer · Browser') myName = 'Device · Browser';
      localStorage.setItem(NAME_KEY, myName);
      localStorage.setItem(NAME_CUSTOM_KEY, isCustomDeviceName ? '1' : '0');

      // Chromium Android 的 UA Client Hints 可提供更准确的型号；失败时回退为常规品牌名。
      if (navigator.userAgentData && typeof navigator.userAgentData.getHighEntropyValues === 'function') {
        navigator.userAgentData.getHighEntropyValues(['model', 'platform']).then(info => {
          deviceProfile = inferDeviceProfile(info.model || '', info.platform || '');
          if (!isCustomDeviceName) {
            myName = formatDeviceName(deviceProfile);
            localStorage.setItem(NAME_KEY, myName);
          }
          refreshHeaderLabels();
          emitSignal({ type: 'hello' });
        }).catch(() => {});
      }

      let roomCode = localStorage.getItem(ROOM_KEY) || '0411';
      localStorage.setItem(ROOM_KEY, roomCode);

      const selfIdentityBtn = document.getElementById('selfIdentityBtn');
      const roomCodeText = document.getElementById('roomCodeText');
      const idleSubText = document.getElementById('idleSubText');
      const signalBeacon = document.getElementById('signalBeacon');

      function refreshHeaderLabels() {
        selfIdentityBtn.textContent = myName;
        roomCodeText.textContent = roomCode;
        idleSubText.textContent = `CH // ${roomCode}`;
      }
      refreshHeaderLabels();

      let bc = null;
      let mqttClient = null;

      function emitSignal(packet) {
        const raw = JSON.stringify({
          ...packet,
          from: myId,
          fromName: myName,
          kindLabel: deviceProfile.kindLabel,
          deviceProfile,
          room: roomCode,
          ts: Date.now()
        });
        if (bc) { try { bc.postMessage(raw); } catch (e) {} }
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(`xiangvisuals/drop/${roomCode}`, raw);
        }
      }

      function connectSignaling() {
        peers.forEach(p => { if (p.pc) p.pc.close(); });
        peers.clear();
        syncStripDOM();

        if (bc) bc.close();
        bc = new BroadcastChannel(`xv_drop_${roomCode}`);
        bc.onmessage = (e) => onSignalReceived(e.data);

        if (mqttClient) { try { mqttClient.end(true); } catch (e) {} }
        signalBeacon.classList.remove('active');

        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: myId + '_' + Math.random().toString(16).slice(2, 6),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 3000
        });

        mqttClient.on('connect', () => {
          signalBeacon.classList.add('active');
          mqttClient.subscribe(`xiangvisuals/drop/${roomCode}`, () => {
            emitSignal({ type: 'hello' });
          });
        });

        mqttClient.on('message', (_, buf) => onSignalReceived(buf.toString()));
        mqttClient.on('offline', () => signalBeacon.classList.remove('active'));

        emitSignal({ type: 'hello' });
      }

      setInterval(() => {
        emitSignal({ type: 'hello' });
        const now = Date.now();
        let mutated = false;
        peers.forEach((p, k) => {
          if (now - p.lastSeen > 15000) {
            if (p.pc) p.pc.close();
            peers.delete(k);
            mutated = true;
          }
        });
        if (mutated) syncStripDOM();
      }, 4800);

      window.addEventListener('beforeunload', () => emitSignal({ type: 'bye' }));

      // ================== 7. WebRTC 点对点引擎 ==================
      const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

      async function onSignalReceived(raw) {
        let msg;
        try { msg = JSON.parse(raw); } catch (e) { return; }
        if (!msg || msg.from === myId || msg.room !== roomCode) return;

        if (msg.type === 'bye') {
          const old = peers.get(msg.from);
          if (old?.pc) old.pc.close();
          peers.delete(msg.from);
          syncStripDOM();
          return;
        }

        let peer = peers.get(msg.from);
        const isNew = !peer;
        if (!peer) {
          peer = {
            id: msg.from,
            name: msg.fromName || 'Device',
            kindLabel: msg.kindLabel || 'DEVICE',
            profile: normalizeRemoteProfile(msg.deviceProfile || { kindLabel: msg.kindLabel }, '', ''),
            lastSeen: Date.now(),
            pc: null,
            dc: null,
            progress: 0
          };
          peers.set(msg.from, peer);
        } else {
          peer.lastSeen = Date.now();
          let peerChanged = false;
          if (msg.fromName && peer.name !== msg.fromName) { peer.name = msg.fromName; peerChanged = true; }
          if (msg.deviceProfile) {
            const nextProfile = normalizeRemoteProfile(msg.deviceProfile, '', '');
            if (!peer.profile || peer.profile.brandKey !== nextProfile.brandKey || peer.profile.model !== nextProfile.model || peer.profile.browser !== nextProfile.browser || peer.profile.deviceType !== nextProfile.deviceType) {
              peer.profile = nextProfile;
              peerChanged = true;
            }
            peer.kindLabel = nextProfile.kindLabel;
          }
          if (peerChanged) syncStripDOM();
        }

        if (isNew) syncStripDOM();

        if (msg.type === 'hello') {
          emitSignal({ type: 'hello_ack', to: msg.from });
          return;
        }
        if (msg.to && msg.to !== myId) return;

        if (msg.type === 'offer') {
          const pc = buildPeerConnection(peer, false);
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          emitSignal({ type: 'answer', to: peer.id, sdp: pc.localDescription });
        } else if (msg.type === 'answer' && peer.pc) {
          await peer.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        } else if (msg.type === 'candidate' && peer.pc && msg.candidate) {
          try { await peer.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
        }
      }

      function buildPeerConnection(peer, initiator) {
        if (peer.pc) peer.pc.close();
        const pc = new RTCPeerConnection(rtcConfig);
        peer.pc = pc;

        pc.onicecandidate = (e) => {
          if (e.candidate) emitSignal({ type: 'candidate', to: peer.id, candidate: e.candidate });
        };

        if (initiator) {
          bindDataChannel(peer, pc.createDataChannel('xv_drop'));
        } else {
          pc.ondatachannel = (e) => bindDataChannel(peer, e.channel);
        }
        return pc;
      }

      function openChannel(peer) {
        return new Promise(async (resolve, reject) => {
          if (peer.dc && peer.dc.readyState === 'open') return resolve(peer.dc);
          const pc = buildPeerConnection(peer, true);
          const t = setTimeout(() => reject(new Error('TIMEOUT')), 10000);
          peer._readyCb = (dc) => { clearTimeout(t); resolve(dc); };
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          emitSignal({ type: 'offer', to: peer.id, sdp: pc.localDescription });
        });
      }

      function bindDataChannel(peer, dc) {
        peer.dc = dc;
        dc.binaryType = 'arraybuffer';
        let meta = null, chunks = [], received = 0;

        dc.onopen = () => {
          if (peer._readyCb) { peer._readyCb(dc); peer._readyCb = null; }
        };

        dc.onmessage = (e) => {
          if (typeof e.data === 'string') {
            const p = JSON.parse(e.data);
            if (p.kind === 'text') {
              showIncomingText(peer.name, p.text);
            } else if (p.kind === 'file-start') {
              meta = p; chunks = []; received = 0;
              setSliceProgress(peer.id, 2);
            } else if (p.kind === 'file-end' && meta) {
              const blob = new Blob(chunks, { type: meta.mime || 'application/octet-stream' });
              setSliceProgress(peer.id, 0);
              showIncomingFile(peer.name, meta.name, meta.size, meta.mime, blob);
              meta = null; chunks = [];
            }
          } else if (e.data instanceof ArrayBuffer && meta) {
            chunks.push(e.data);
            received += e.data.byteLength;
            setSliceProgress(peer.id, Math.min(100, Math.round((received / (meta.size || 1)) * 100)));
          }
        };
      }

      function setSliceProgress(peerId, pct) {
        const peer = peers.get(peerId);
        if (peer) peer.progress = pct;
        const bar = document.getElementById('prog_' + peerId);
        if (bar) bar.style.width = pct + '%';
      }

      async function sendFilesToPeer(peerId, files) {
        const peer = peers.get(peerId);
        if (!peer) return;
        try {
          whisper(`CONNECTING // ${peer.name.toUpperCase()}`);
          const dc = await openChannel(peer);
          const CHUNK = 16384;
          for (const file of files) {
            dc.send(JSON.stringify({ kind: 'file-start', name: file.name, size: file.size, mime: file.type }));
            const buf = await file.arrayBuffer();
            let pos = 0;
            while (pos < buf.byteLength) {
              if (dc.bufferedAmount > 262144) {
                await new Promise(r => setTimeout(r, 14));
                continue;
              }
              const part = buf.slice(pos, pos + CHUNK);
              dc.send(part);
              pos += part.byteLength;
              setSliceProgress(peerId, Math.round((pos / buf.byteLength) * 100));
            }
            dc.send(JSON.stringify({ kind: 'file-end' }));
            setSliceProgress(peerId, 0);
            whisper(`DELIVERED // ${file.name}`);
          }
        } catch (e) {
          setSliceProgress(peerId, 0);
          whisper('TRANSMISSION INTERRUPTED');
        }
      }

      async function sendTextToPeer(peerId, text) {
        const peer = peers.get(peerId);
        if (!peer || !text.trim()) return;
        try {
          const dc = await openChannel(peer);
          dc.send(JSON.stringify({ kind: 'text', text: text.trim() }));
          whisper(`SENT // ${peer.name.toUpperCase()}`);
        } catch (e) {
          whisper('FAILED TO SEND');
        }
      }

      // ================== 8. 弹窗交互控制 ==================
      const receiveSheet = document.getElementById('receiveSheet');
      const recIndex = document.getElementById('recIndex');
      const recHeading = document.getElementById('recHeading');
      const recImg = document.getElementById('recImg');
      const recSpecs = document.getElementById('recSpecs');
      const recSaveBtn = document.getElementById('recSaveBtn');
      const recDismissBtn = document.getElementById('recDismissBtn');
      let activeBlobUrl = null;

      function closeReceive() {
        receiveSheet.classList.remove('active');
        if (activeBlobUrl) { URL.revokeObjectURL(activeBlobUrl); activeBlobUrl = null; }
      }
      recDismissBtn.addEventListener('click', closeReceive);

      function showIncomingFile(fromName, name, size, mime, blob) {
        if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = URL.createObjectURL(blob);

        recIndex.textContent = `FROM // ${fromName.toUpperCase()}`;
        recHeading.textContent = '收到文件';

        if (mime && mime.startsWith('image/')) {
          recImg.src = activeBlobUrl;
          recImg.style.display = 'block';
        } else {
          recImg.style.display = 'none';
        }

        recSpecs.innerHTML = `
          <div class="spec-line"><span>FILE</span><span>${escapeHtml(name)}</span></div>
          <div class="spec-line"><span>SIZE</span><span>${formatBytes(size)}</span></div>
        `;

        recSaveBtn.textContent = '保存';
        recSaveBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = activeBlobUrl;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          closeReceive();
        };
        receiveSheet.classList.add('active');
      }

      function showIncomingText(fromName, text) {
        recIndex.textContent = `FROM // ${fromName.toUpperCase()}`;
        recHeading.textContent = '收到文本';
        recImg.style.display = 'none';
        recSpecs.innerHTML = `
          <div class="spec-line" style="flex-direction:column; gap:8px;">
            <span style="max-width:100%; text-align:left; user-select:text; font-family:var(--font-serif); font-size:16px; line-height:1.6;">${escapeHtml(text)}</span>
          </div>
        `;
        recSaveBtn.textContent = '复制';
        recSaveBtn.onclick = () => {
          navigator.clipboard.writeText(text).then(() => {
            whisper('COPIED');
            closeReceive();
          });
        };
        receiveSheet.classList.add('active');
      }

      // 通用输入面板
      const promptSheet = document.getElementById('promptSheet');
      const prmIndex = document.getElementById('prmIndex');
      const prmHeading = document.getElementById('prmHeading');
      const prmInput = document.getElementById('prmInput');
      const prmTextarea = document.getElementById('prmTextarea');
      const prmCancelBtn = document.getElementById('prmCancelBtn');
      const prmOkBtn = document.getElementById('prmOkBtn');

      prmCancelBtn.addEventListener('click', () => promptSheet.classList.remove('active'));

      [receiveSheet, promptSheet].forEach(sheet => {
        sheet.addEventListener('click', (event) => {
          if (event.target !== sheet) return;
          if (sheet === receiveSheet) closeReceive();
          else sheet.classList.remove('active');
        });
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          receiveSheet.classList.remove('active');
          promptSheet.classList.remove('active');
        }
      });

      function openTextComposer(peerId) {
        const peer = peers.get(peerId);
        if (!peer) return;
        prmIndex.textContent = `TO // ${peer.name.toUpperCase()}`;
        prmHeading.textContent = '投递文字';
        prmInput.style.display = 'none';
        prmTextarea.style.display = 'block';
        prmTextarea.value = '';
        promptSheet.classList.add('active');
        setTimeout(() => prmTextarea.focus(), 60);

        prmOkBtn.onclick = () => {
          const v = prmTextarea.value;
          promptSheet.classList.remove('active');
          sendTextToPeer(peerId, v);
        };
      }

      selfIdentityBtn.addEventListener('click', () => {
        prmIndex.textContent = 'IDENTITY';
        prmHeading.textContent = '设备名称';
        prmTextarea.style.display = 'none';
        prmInput.style.display = 'block';
        prmInput.value = myName;
        promptSheet.classList.add('active');
        setTimeout(() => prmInput.focus(), 60);

        prmOkBtn.onclick = () => {
          const v = prmInput.value.trim();
          if (v) {
            myName = v.replace(/[\u0000-\u001F\u007F]/g, '').trim().slice(0, 28);
            if (myName) {
              isCustomDeviceName = true;
              localStorage.setItem(NAME_KEY, myName);
              localStorage.setItem(NAME_CUSTOM_KEY, '1');
              refreshHeaderLabels();
              emitSignal({ type: 'hello' });
            }
          }
          promptSheet.classList.remove('active');
        };
      });

      document.getElementById('roomTrigger').addEventListener('click', () => {
        prmIndex.textContent = 'CHANNEL';
        prmHeading.textContent = '配对频道';
        prmTextarea.style.display = 'none';
        prmInput.style.display = 'block';
        prmInput.value = roomCode;
        promptSheet.classList.add('active');
        setTimeout(() => prmInput.focus(), 60);

        prmOkBtn.onclick = () => {
          const v = prmInput.value.trim().toUpperCase();
          if (v) {
            roomCode = v.slice(0, 10);
            localStorage.setItem(ROOM_KEY, roomCode);
            refreshHeaderLabels();
            connectSignaling();
          }
          promptSheet.classList.remove('active');
        };
      });

      // 全局拖拽与快捷键粘贴
      hiddenFileInput.addEventListener('change', (e) => {
        if (e.target.files.length && activeTargetPeerId) {
          sendFilesToPeer(activeTargetPeerId, Array.from(e.target.files));
        }
      });

      const centerStage = document.getElementById('centerStage');
      centerStage.addEventListener('dragover', (e) => {
        e.preventDefault();
        centerStage.classList.add('drag-over');
      });
      centerStage.addEventListener('dragleave', (e) => {
        if (e.target === centerStage) centerStage.classList.remove('drag-over');
      });
      centerStage.addEventListener('drop', (e) => {
        e.preventDefault();
        centerStage.classList.remove('drag-over');
        const list = Array.from(peers.values());
        if (list.length && e.dataTransfer.files.length) {
          const target = list[focusIndex] || list[0];
          sendFilesToPeer(target.id, Array.from(e.dataTransfer.files));
        }
      });

      window.addEventListener('paste', (e) => {
        if (promptSheet.classList.contains('active')) return;
        const list = Array.from(peers.values());
        if (!list.length) return;
        const target = list[focusIndex] || list[0];
        const items = e.clipboardData?.items;
        if (!items) return;
        const files = [];
        for (let i = 0; i < items.length; i++) {
          if (items[i].kind === 'file') {
            const f = items[i].getAsFile();
            if (f) files.push(f);
          }
        }
        if (files.length) {
          sendFilesToPeer(target.id, files);
        } else {
          const txt = e.clipboardData.getData('text');
          if (txt) sendTextToPeer(target.id, txt);
        }
      });

      connectSignaling();
    })();
  </script>
</body>
</html>
