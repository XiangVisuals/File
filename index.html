<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XIANG VISUALS — DROP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Montserrat:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F4F4F5;
      --bg-overlay: rgba(255, 255, 255, 0.92);
      --text-primary: #0A0A0A;
      --text-secondary: #666666;
      --text-muted: #A1A1AA;
      --border-line: #E2E2E2;
      --border-strong: #0A0A0A;
      --accent-vermilion: #C82829;
      
      --font-brand: 'Cinzel', 'Noto Serif SC', serif;
      --font-editorial: 'Noto Serif SC', serif;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-silky: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --bg-primary: #0A0A0A;
      --bg-secondary: #121214;
      --bg-overlay: rgba(10, 10, 10, 0.92);
      --text-primary: #F4F4F5;
      --text-secondary: #888888;
      --text-muted: #52525B;
      --border-line: #222225;
      --border-strong: #F4F4F5;
      --accent-vermilion: #D9383A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      transition: background-color 0.45s var(--ease-silky), color 0.45s var(--ease-silky);
      user-select: none;
    }

    /* 瑞士建筑网格主框架 */
    .grid-shell {
      display: grid;
      grid-template-rows: 60px 1fr 48px;
      width: 100vw;
      height: 100vh;
      border: 1px solid var(--border-line);
      position: relative;
    }

    /* 顶栏 */
    .header-bar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      border-bottom: 1px solid var(--border-line);
      background: var(--bg-primary);
      z-index: 20;
    }

    .brand-cell {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      height: 100%;
    }

    .brand-title {
      font-family: var(--font-brand);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 3.5px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand-divider {
      width: 1px;
      height: 14px;
      background: var(--border-line);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
    }

    .header-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      height: 100%;
      border-left: 1px solid var(--border-line);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      display: inline-block;
      transition: background-color 0.3s var(--ease-out);
    }

    .status-dot.online {
      background-color: var(--accent-vermilion);
      box-shadow: 0 0 8px rgba(200, 40, 41, 0.45);
    }

    .room-btn, .icon-action {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 100%;
      padding: 0 4px;
      transition: opacity 0.25s var(--ease-out);
    }

    .room-btn:hover, .icon-action:hover {
      opacity: 0.6;
    }

    /* 中心画布区域 */
    .stage-area {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 32px;
    }

    /* 建筑取景框线与十字准星 */
    .viewfinder-frame {
      position: absolute;
      inset: 28px;
      border: 1px solid var(--border-line);
      pointer-events: none;
      z-index: 1;
    }

    .vf-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--text-primary);
      border-style: solid;
      border-width: 0;
      transition: all 0.4s var(--ease-out);
    }
    .vf-tl { top: -1px; left: -1px; border-top-width: 1.5px; border-left-width: 1.5px; }
    .vf-tr { top: -1px; right: -1px; border-top-width: 1.5px; border-right-width: 1.5px; }
    .vf-bl { bottom: -1px; left: -1px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
    .vf-br { bottom: -1px; right: -1px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

    .stage-area.drag-active .vf-corner {
      width: 24px;
      height: 24px;
      border-color: var(--accent-vermilion);
    }

    /* 中心十字微标 */
    .center-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      pointer-events: none;
      opacity: 0.25;
      z-index: 1;
    }
    .center-crosshair::before, .center-crosshair::after {
      content: '';
      position: absolute;
      background: var(--text-primary);
    }
    .center-crosshair::before { top: 11.5px; left: 0; width: 24px; height: 1px; }
    .center-crosshair::after { left: 11.5px; top: 0; width: 1px; height: 24px; }

    /* 空状态（无任何演示设备） */
    .empty-state {
      position: relative;
      z-index: 5;
      text-align: center;
      max-width: 420px;
      padding: 40px 24px;
      transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
    }

    .empty-index {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .scan-line-indicator {
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--border-line);
      position: relative;
      overflow: hidden;
    }

    .scan-line-indicator::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent-vermilion);
      animation: scanSlide 2.4s infinite var(--ease-silky);
    }

    @keyframes scanSlide {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }

    .empty-title {
      font-family: var(--font-editorial);
      font-size: clamp(22px, 2.5vw, 30px);
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .empty-desc {
      font-size: 12px;
      line-height: 1.8;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* 真实设备网格列表 */
    .peers-grid {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
      gap: -1px;
      max-width: 960px;
      width: 100%;
      justify-content: center;
    }

    .peers-grid:empty {
      display: none;
    }

    /* 设备画廊展卡 */
    .peer-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-line);
      padding: 28px 24px 22px;
      position: relative;
      cursor: pointer;
      transition: border-color 0.3s var(--ease-out), transform 0.3s var(--ease-out), background-color 0.3s var(--ease-out);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      margin: -0.5px;
    }

    .peer-card:hover, .peer-card.drag-over {
      border-color: var(--border-strong);
      z-index: 2;
      background: var(--bg-secondary);
    }

    .peer-card.drag-over {
      border-color: var(--accent-vermilion);
    }

    .peer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .peer-index {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .peer-type-icon {
      font-size: 18px;
      color: var(--text-primary);
    }

    .peer-name {
      font-family: var(--font-editorial);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .peer-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .peer-actions {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-btn {
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s var(--ease-out);
    }

    .action-btn:hover {
      color: var(--text-primary);
    }

    /* 传输进度条（极简 1.5px 底边朱砂红） */
    .peer-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: transparent;
      overflow: hidden;
    }

    .peer-progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent-vermilion);
      transition: width 0.15s linear;
    }

    /* 底栏（EXIF 参数条风格） */
    .footer-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-top: 1px solid var(--border-line);
      background: var(--bg-primary);
      padding: 0 28px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      z-index: 20;
    }

    .self-identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .self-label {
      color: var(--text-muted);
    }

    .self-name-btn {
      background: none;
      border: none;
      border-bottom: 1px dashed var(--border-line);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      padding-bottom: 1px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .self-name-btn:hover {
      border-color: var(--text-primary);
    }

    .shortcut-hint {
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    /* 模态框（接收确认 / 发送文字 / 房间码修改） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-out);
      padding: 24px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-primary);
      border: 1px solid var(--border-strong);
      padding: 32px;
      transform: translateY(12px);
      transition: transform 0.35s var(--ease-out);
    }

    .modal-backdrop.active .modal-box {
      transform: translateY(0);
    }

    .modal-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent-vermilion);
      margin-bottom: 10px;
    }

    .modal-title {
      font-family: var(--font-editorial);
      font-size: 22px;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    .modal-preview {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: var(--bg-secondary);
      border: 1px solid var(--border-line);
      margin-bottom: 16px;
      display: none;
    }

    .modal-meta-list {
      border-top: 1px solid var(--border-line);
      border-bottom: 1px solid var(--border-line);
      padding: 12px 0;
      margin-bottom: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
    }

    .meta-row span:last-child {
      color: var(--text-primary);
      word-break: break-all;
      text-align: right;
      max-width: 70%;
    }

    .modal-input, .modal-textarea {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-line);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 12px 14px;
      margin-bottom: 24px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-textarea {
      min-height: 110px;
      resize: vertical;
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    .modal-input:focus, .modal-textarea:focus {
      border-color: var(--border-strong);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn- architectural {
      height: 40px;
      border: 1px solid var(--border-line);
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
    }

    .btn-architectural:hover {
      border-color: var(--border-strong);
    }

    .btn-architectural.primary {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }

    .btn-architectural.primary:hover {
      opacity: 0.86;
    }

    /* 顶部轻提示 Toast */
    .toast-bar {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translate(-50%, -16px);
      background: var(--text-primary);
      color: var(--bg-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      padding: 10px 20px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s var(--ease-out);
    }

    .toast-bar.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 640px) {
      .grid-shell {
        grid-template-rows: 54px 1fr 44px;
      }
      .brand-cell { padding: 0 16px; }
      .brand-sub { display: none; }
      .brand-divider { display: none; }
      .header-cell { padding: 0 14px; }
      .viewfinder-frame { inset: 14px; }
      .footer-bar { padding: 0 16px; }
      .shortcut-hint { display: none; }
    }
  </style>
</head>
<body>

  <div class="grid-shell">
    <!-- 顶部结构导航栏 -->
    <header class="header-bar">
      <div class="brand-cell">
        <a href="https://xiangvisuals.com/" target="_blank" rel="noopener" class="brand-title">XIANG VISUALS</a>
        <span class="brand-divider"></span>
        <span class="brand-sub">LOCAL DROP</span>
      </div>

      <div class="header-cell">
        <span class="status-dot" id="signalDot"></span>
        <button class="room-btn" id="roomBtn" title="点击修改配对频道码">
          <span>CH // <strong id="roomCodeDisplay">----</strong></span>
        </button>
      </div>

      <div class="header-cell">
        <button class="icon-action" id="themeToggleBtn" title="切换明暗主题">
          <i class="ri-contrast-2-line" style="font-size: 15px;"></i>
        </button>
      </div>
    </header>

    <!-- 中心画廊级工作区 -->
    <main class="stage-area" id="stageArea">
      <div class="viewfinder-frame">
        <div class="vf-corner vf-tl"></div>
        <div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div>
        <div class="vf-corner vf-br"></div>
      </div>

      <div class="center-crosshair" id="centerCrosshair"></div>

      <!-- 纯净待机空状态（无任何虚假设备） -->
      <div class="empty-state" id="emptyState">
        <div class="empty-index">
          <span>WAITING FOR PEERS</span>
          <span class="scan-line-indicator"></span>
        </div>
        <h1 class="empty-title">等待附近设备接入</h1>
        <p class="empty-desc">
          在其他设备打开本页面并保持相同频道码（CH），<br/>
          即可建立点对点加密直连。
        </p>
      </div>

      <!-- 真实在线节点网格 -->
      <div class="peers-grid" id="peersGrid"></div>
    </main>

    <!-- 底部设备信息栏 -->
    <footer class="footer-bar">
      <div class="self-identity">
        <span class="self-label">本机标识 //</span>
        <button class="self-name-btn" id="selfNameBtn" title="点击修改本机名称">加载中...</button>
      </div>
      <div class="shortcut-hint">支持直接拖拽文件 或 Ctrl/Cmd + V 粘贴发送</div>
    </footer>
  </div>

  <!-- 隐藏的文件选择器 -->
  <input type="file" id="fileInput" multiple style="display: none;" />

  <!-- 模态框：接收文件/文本 -->
  <div class="modal-backdrop" id="receiveModal">
    <div class="modal-box">
      <div class="modal-eyebrow" id="recEyebrow">INCOMING // 收到投递</div>
      <h2 class="modal-title" id="recTitle">文件接收确认</h2>
      <img class="modal-preview" id="recPreviewImg" alt="Preview" />
      <div class="modal-meta-list" id="recMetaList"></div>
      <div class="modal-actions">
        <button class="btn-architectural" id="recDeclineBtn">忽略</button>
        <button class="btn-architectural primary" id="recAcceptBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 模态框：发送文本或修改设置 -->
  <div class="modal-backdrop" id="inputModal">
    <div class="modal-box">
      <div class="modal-eyebrow" id="inpEyebrow">MESSAGE // 文本传输</div>
      <h2 class="modal-title" id="inpTitle">发送内容</h2>
      <input type="text" class="modal-input" id="inpTextField" style="display: none;" />
      <textarea class="modal-textarea" id="inpAreaField" placeholder="在此输入文本或链接..."></textarea>
      <div class="modal-actions">
        <button class="btn-architectural" id="inpCancelBtn">取消</button>
        <button class="btn-architectural primary" id="inpConfirmBtn">确认</button>
      </div>
    </div>
  </div>

  <!-- 状态提示 -->
  <div class="toast-bar" id="toastBar"></div>

  <!-- 引入轻量 MQTT 客户端用于跨设备零配置 WebRTC 信令握手 -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script>
    (function () {
      // ================== 1. 主题与基础状态 ==================
      const THEME_KEY = 'xv_drop_theme';
      const NAME_KEY = 'xv_drop_device_name';
      const ROOM_KEY = 'xv_drop_room_code';

      const root = document.documentElement;
      const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      root.setAttribute('data-theme', savedTheme);

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
      });

      function showToast(msg) {
        const bar = document.getElementById('toastBar');
        bar.textContent = msg;
        bar.classList.add('show');
        clearTimeout(bar._timer);
        bar._timer = setTimeout(() => bar.classList.remove('show'), 2600);
      }

      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      // ================== 2. 本机标识与频道生成 ==================
      const myPeerId = 'peer_' + Math.random().toString(36).substring(2, 10);

      function detectDeviceType() {
        const ua = navigator.userAgent;
        if (/iPad|Tablet/i.test(ua)) return { icon: 'ri-tablet-line', label: 'TABLET' };
        if (/iPhone|Android|Mobile/i.test(ua)) return { icon: 'ri-smartphone-line', label: 'MOBILE' };
        return { icon: 'ri-macbook-line', label: 'DESKTOP' };
      }

      function generateDefaultName() {
        const ua = navigator.userAgent;
        let os = 'Node';
        if (/Mac/i.test(ua)) os = 'macOS';
        else if (/iPhone/i.test(ua)) os = 'iPhone';
        else if (/iPad/i.test(ua)) os = 'iPad';
        else if (/Android/i.test(ua)) os = 'Android';
        else if (/Win/i.test(ua)) os = 'Windows';
        const code = Math.floor(100 + Math.random() * 900);
        return `${os}-${code}`;
      }

      const myDeviceInfo = detectDeviceType();
      let myName = localStorage.getItem(NAME_KEY) || generateDefaultName();
      localStorage.setItem(NAME_KEY, myName);

      // 默认 4 位频道码（方便局域网手机与电脑直接配对）
      let currentRoom = localStorage.getItem(ROOM_KEY) || '0411';
      localStorage.setItem(ROOM_KEY, currentRoom);

      const selfNameBtn = document.getElementById('selfNameBtn');
      const roomCodeDisplay = document.getElementById('roomCodeDisplay');
      selfNameBtn.textContent = myName;
      roomCodeDisplay.textContent = currentRoom;

      // ================== 3. 节点状态管理与 UI 渲染 ==================
      // peers: Map<peerId, { id, name, deviceType, lastSeen, pc, dc, progress }>
      const peers = new Map();
      let activeTargetPeerId = null;

      const emptyStateEl = document.getElementById('emptyState');
      const peersGridEl = document.getElementById('peersGrid');
      const centerCrosshair = document.getElementById('centerCrosshair');
      const fileInput = document.getElementById('fileInput');

      function renderPeers() {
        const list = Array.from(peers.values());
        if (list.length === 0) {
          emptyStateEl.style.display = 'block';
          centerCrosshair.style.display = 'block';
          peersGridEl.innerHTML = '';
          return;
        }

        emptyStateEl.style.display = 'none';
        centerCrosshair.style.display = 'none';

        peersGridEl.innerHTML = list.map((peer, idx) => {
          const num = String(idx + 1).padStart(2, '0');
          const isConnected = peer.dc && peer.dc.readyState === 'open';
          return `
            <div class="peer-card" data-peer-id="${peer.id}">
              <div>
                <div class="peer-top">
                  <span class="peer-index">NODE // ${num}</span>
                  <i class="${peer.deviceType?.icon || 'ri-macbook-line'} peer-type-icon"></i>
                </div>
                <div class="peer-name">${escapeHtml(peer.name)}</div>
                <div class="peer-meta">
                  <span>${peer.deviceType?.label || 'DEVICE'}</span>
                  <span>·</span>
                  <span>${isConnected ? 'P2P DIRECT' : 'READY'}</span>
                </div>
              </div>
              <div class="peer-actions">
                <button class="action-btn" data-action="file" data-peer-id="${peer.id}">
                  <i class="ri-folder-upload-line"></i> 发送文件
                </button>
                <button class="action-btn" data-action="text" data-peer-id="${peer.id}">
                  <i class="ri-text"></i> 发送文字
                </button>
              </div>
              <div class="peer-progress-track">
                <div class="peer-progress-bar" id="prog_${peer.id}" style="width: ${peer.progress || 0}%"></div>
              </div>
            </div>
          `;
        }).join('');

        // 绑定卡片事件
        peersGridEl.querySelectorAll('.peer-card').forEach(card => {
          const pid = card.getAttribute('data-peer-id');

          card.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            const action = btn ? btn.getAttribute('data-action') : 'file';
            activeTargetPeerId = pid;
            if (action === 'text') {
              openTextModal(pid);
            } else {
              fileInput.value = '';
              fileInput.click();
            }
          });

          card.addEventListener('dragover', (e) => {
            e.preventDefault();
            card.classList.add('drag-over');
          });

          card.addEventListener('dragleave', () => {
            card.classList.remove('drag-over');
          });

          card.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            card.classList.remove('drag-over');
            document.getElementById('stageArea').classList.remove('drag-active');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
              sendFilesToPeer(pid, Array.from(e.dataTransfer.files));
            }
          });
        });
      }

      function updatePeerProgress(peerId, percent) {
        const peer = peers.get(peerId);
        if (peer) peer.progress = percent;
        const bar = document.getElementById('prog_' + peerId);
        if (bar) bar.style.width = percent + '%';
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, s => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[s]));
      }

      // ================== 4. 双重信令层 (BroadcastChannel + MQTT WebSocket) ==================
      let bc = null;
      let mqttClient = null;
      const signalDot = document.getElementById('signalDot');

      function sendSignal(payload) {
        const message = JSON.stringify({
          ...payload,
          from: myPeerId,
          fromName: myName,
          deviceType: myDeviceInfo,
          room: currentRoom,
          ts: Date.now()
        });
        if (bc) {
          try { bc.postMessage(message); } catch (e) {}
        }
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(`xiangvisuals/drop/${currentRoom}`, message);
        }
      }

      function initSignaling() {
        // 清理旧连接
        peers.forEach(p => { if (p.pc) p.pc.close(); });
        peers.clear();
        renderPeers();

        if (bc) bc.close();
        bc = new BroadcastChannel(`xv_drop_${currentRoom}`);
        bc.onmessage = (ev) => handleSignalMessage(ev.data);

        if (mqttClient) {
          try { mqttClient.end(true); } catch (e) {}
        }

        signalDot.classList.remove('online');
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'xv_' + myPeerId + '_' + Math.random().toString(16).slice(2, 6),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 3000
        });

        mqttClient.on('connect', () => {
          signalDot.classList.add('online');
          mqttClient.subscribe(`xiangvisuals/drop/${currentRoom}`, () => {
            announcePresence();
          });
        });

        mqttClient.on('message', (topic, messageBuffer) => {
          handleSignalMessage(messageBuffer.toString());
        });

        mqttClient.on('offline', () => {
          signalDot.classList.remove('online');
        });

        // 同机立即可见
        announcePresence();
      }

      function announcePresence() {
        sendSignal({ type: 'hello' });
      }

      // 定时心跳与离线清理
      setInterval(() => {
        announcePresence();
        const now = Date.now();
        let changed = false;
        peers.forEach((peer, id) => {
          if (now - peer.lastSeen > 16000) {
            if (peer.pc) peer.pc.close();
            peers.delete(id);
            changed = true;
          }
        });
        if (changed) renderPeers();
      }, 5000);

      window.addEventListener('beforeunload', () => {
        sendSignal({ type: 'bye' });
      });

      // ================== 5. WebRTC P2P 核心与分块传输 ==================
      const rtcConfig = {
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      };

      async function handleSignalMessage(raw) {
        let msg;
        try { msg = JSON.parse(raw); } catch (e) { return; }
        if (!msg || msg.from === myPeerId || msg.room !== currentRoom) return;

        const remoteId = msg.from;

        if (msg.type === 'bye') {
          const p = peers.get(remoteId);
          if (p && p.pc) p.pc.close();
          peers.delete(remoteId);
          renderPeers();
          return;
        }

        let peer = peers.get(remoteId);
        const isNew = !peer;
        if (!peer) {
          peer = {
            id: remoteId,
            name: msg.fromName || 'Node',
            deviceType: msg.deviceType || { icon: 'ri-macbook-line', label: 'DEVICE' },
            lastSeen: Date.now(),
            pc: null,
            dc: null,
            progress: 0
          };
          peers.set(remoteId, peer);
        } else {
          peer.lastSeen = Date.now();
          if (msg.fromName && peer.name !== msg.fromName) {
            peer.name = msg.fromName;
            renderPeers();
          }
        }

        if (isNew) renderPeers();

        if (msg.type === 'hello') {
          sendSignal({ type: 'hello_ack', to: remoteId });
          return;
        }

        if (msg.to && msg.to !== myPeerId) return;

        if (msg.type === 'offer') {
          const pc = createPeerConnection(peer, false);
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignal({ type: 'answer', to: remoteId, sdp: pc.localDescription });
        } else if (msg.type === 'answer' && peer.pc) {
          await peer.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        } else if (msg.type === 'candidate' && peer.pc && msg.candidate) {
          try { await peer.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
        }
      }

      function createPeerConnection(peer, isInitiator) {
        if (peer.pc) peer.pc.close();
        const pc = new RTCPeerConnection(rtcConfig);
        peer.pc = pc;

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            sendSignal({ type: 'candidate', to: peer.id, candidate: e.candidate });
          }
        };

        if (isInitiator) {
          const dc = pc.createDataChannel('xv_drop_channel');
          setupDataChannel(peer, dc);
        } else {
          pc.ondatachannel = (e) => {
            setupDataChannel(peer, e.channel);
          };
        }

        return pc;
      }

      function ensureDataChannel(peer) {
        return new Promise(async (resolve, reject) => {
          if (peer.dc && peer.dc.readyState === 'open') {
            return resolve(peer.dc);
          }
          const pc = createPeerConnection(peer, true);
          const timer = setTimeout(() => reject(new Error('连接超时')), 10000);
          peer._onChannelOpen = (dc) => {
            clearTimeout(timer);
            resolve(dc);
          };
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          sendSignal({ type: 'offer', to: peer.id, sdp: pc.localDescription });
        });
      }

      function setupDataChannel(peer, dc) {
        peer.dc = dc;
        dc.binaryType = 'arraybuffer';

        let incomingMeta = null;
        let receivedBuffers = [];
        let receivedBytes = 0;

        dc.onopen = () => {
          renderPeers();
          if (peer._onChannelOpen) {
            peer._onChannelOpen(dc);
            peer._onChannelOpen = null;
          }
        };

        dc.onclose = () => renderPeers();

        dc.onmessage = (e) => {
          if (typeof e.data === 'string') {
            const ctrl = JSON.parse(e.data);
            if (ctrl.kind === 'text') {
              presentIncomingText(peer.name, ctrl.text);
            } else if (ctrl.kind === 'file-start') {
              incomingMeta = ctrl;
              receivedBuffers = [];
              receivedBytes = 0;
              updatePeerProgress(peer.id, 1);
            } else if (ctrl.kind === 'file-end' && incomingMeta) {
              const blob = new Blob(receivedBuffers, { type: incomingMeta.mime || 'application/octet-stream' });
              updatePeerProgress(peer.id, 0);
              presentIncomingFile(peer.name, incomingMeta.name, incomingMeta.size, incomingMeta.mime, blob);
              incomingMeta = null;
              receivedBuffers = [];
            }
          } else if (e.data instanceof ArrayBuffer && incomingMeta) {
            receivedBuffers.push(e.data);
            receivedBytes += e.data.byteLength;
            const pct = Math.min(100, Math.round((receivedBytes / (incomingMeta.size || 1)) * 100));
            updatePeerProgress(peer.id, pct);
          }
        };
      }

      // 发送文件（16KB 分块流控）
      async function sendFilesToPeer(peerId, files) {
        const peer = peers.get(peerId);
        if (!peer) return;

        try {
          showToast(`正在连接 ${peer.name}...`);
          const dc = await ensureDataChannel(peer);
          const CHUNK_SIZE = 16384;

          for (const file of files) {
            dc.send(JSON.stringify({
              kind: 'file-start',
              name: file.name,
              size: file.size,
              mime: file.type
            }));

            const buffer = await file.arrayBuffer();
            let offset = 0;

            while (offset < buffer.byteLength) {
              if (dc.bufferedAmount > 262144) {
                await new Promise(r => setTimeout(r, 15));
                continue;
              }
              const slice = buffer.slice(offset, offset + CHUNK_SIZE);
              dc.send(slice);
              offset += slice.byteLength;
              const pct = Math.round((offset / buffer.byteLength) * 100);
              updatePeerProgress(peerId, pct);
            }

            dc.send(JSON.stringify({ kind: 'file-end' }));
            updatePeerProgress(peerId, 0);
            showToast(`已投递 // ${file.name}`);
          }
        } catch (err) {
          updatePeerProgress(peerId, 0);
          showToast('连接未完成，请重试');
        }
      }

      async function sendTextToPeer(peerId, text) {
        const peer = peers.get(peerId);
        if (!peer || !text.trim()) return;
        try {
          const dc = await ensureDataChannel(peer);
          dc.send(JSON.stringify({ kind: 'text', text: text.trim() }));
          showToast(`文本已投递至 ${peer.name}`);
        } catch (err) {
          showToast('文本发送失败');
        }
      }

      // ================== 6. 接收与输入模态框交互 ==================
      const receiveModal = document.getElementById('receiveModal');
      const recEyebrow = document.getElementById('recEyebrow');
      const recTitle = document.getElementById('recTitle');
      const recPreviewImg = document.getElementById('recPreviewImg');
      const recMetaList = document.getElementById('recMetaList');
      const recAcceptBtn = document.getElementById('recAcceptBtn');
      const recDeclineBtn = document.getElementById('recDeclineBtn');

      let currentBlobUrl = null;

      function closeReceiveModal() {
        receiveModal.classList.remove('active');
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = null;
        }
      }

      recDeclineBtn.addEventListener('click', closeReceiveModal);

      function presentIncomingFile(senderName, fileName, fileSize, mime, blob) {
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = URL.createObjectURL(blob);

        recEyebrow.textContent = `INCOMING FILE // FROM ${senderName.toUpperCase()}`;
        recTitle.textContent = '收到文件投递';

        if (mime && mime.startsWith('image/')) {
          recPreviewImg.src = currentBlobUrl;
          recPreviewImg.style.display = 'block';
        } else {
          recPreviewImg.style.display = 'none';
        }

        recMetaList.innerHTML = `
          <div class="meta-row"><span>FILENAME</span><span>${escapeHtml(fileName)}</span></div>
          <div class="meta-row"><span>SIZE</span><span>${formatBytes(fileSize)}</span></div>
          <div class="meta-row"><span>TYPE</span><span>${escapeHtml(mime || 'BINARY')}</span></div>
        `;

        recAcceptBtn.textContent = '下载保存';
        recAcceptBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = currentBlobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          closeReceiveModal();
        };

        receiveModal.classList.add('active');
      }

      function presentIncomingText(senderName, text) {
        recEyebrow.textContent = `INCOMING MESSAGE // FROM ${senderName.toUpperCase()}`;
        recTitle.textContent = '收到文本内容';
        recPreviewImg.style.display = 'none';

        recMetaList.innerHTML = `
          <div class="meta-row" style="flex-direction: column; gap: 8px;">
            <span>CONTENT</span>
            <span style="max-width: 100%; text-align: left; user-select: text; font-family: var(--font-sans); line-height: 1.6;">${escapeHtml(text)}</span>
          </div>
        `;

        recAcceptBtn.textContent = '复制内容';
        recAcceptBtn.onclick = () => {
          navigator.clipboard.writeText(text).then(() => {
            showToast('已复制到剪贴板');
            closeReceiveModal();
          });
        };

        receiveModal.classList.add('active');
      }

      // 通用输入模态框（发文本 / 改名 / 改频道）
      const inputModal = document.getElementById('inputModal');
      const inpEyebrow = document.getElementById('inpEyebrow');
      const inpTitle = document.getElementById('inpTitle');
      const inpTextField = document.getElementById('inpTextField');
      const inpAreaField = document.getElementById('inpAreaField');
      const inpCancelBtn = document.getElementById('inpCancelBtn');
      const inpConfirmBtn = document.getElementById('inpConfirmBtn');

      function closeInputModal() {
        inputModal.classList.remove('active');
      }
      inpCancelBtn.addEventListener('click', closeInputModal);

      function openTextModal(peerId) {
        const peer = peers.get(peerId);
        if (!peer) return;
        inpEyebrow.textContent = `DIRECT TEXT // TO ${peer.name.toUpperCase()}`;
        inpTitle.textContent = '发送文本或链接';
        inpTextField.style.display = 'none';
        inpAreaField.style.display = 'block';
        inpAreaField.value = '';
        inputModal.classList.add('active');
        setTimeout(() => inpAreaField.focus(), 80);

        inpConfirmBtn.onclick = () => {
          const val = inpAreaField.value;
          closeInputModal();
          sendTextToPeer(peerId, val);
        };
      }

      // 修改本机名称
      selfNameBtn.addEventListener('click', () => {
        inpEyebrow.textContent = 'IDENTITY // 本机标识';
        inpTitle.textContent = '修改设备显示名称';
        inpAreaField.style.display = 'none';
        inpTextField.style.display = 'block';
        inpTextField.value = myName;
        inputModal.classList.add('active');
        setTimeout(() => inpTextField.focus(), 80);

        inpConfirmBtn.onclick = () => {
          const val = inpTextField.value.trim();
          if (val) {
            myName = val.slice(0, 24);
            localStorage.setItem(NAME_KEY, myName);
            selfNameBtn.textContent = myName;
            announcePresence();
            showToast('本机标识已更新');
          }
          closeInputModal();
        };
      });

      // 修改配对频道码
      document.getElementById('roomBtn').addEventListener('click', () => {
        inpEyebrow.textContent = 'CHANNEL // 配对频道';
        inpTitle.textContent = '设置局域网配对频道码';
        inpAreaField.style.display = 'none';
        inpTextField.style.display = 'block';
        inpTextField.value = currentRoom;
        inputModal.classList.add('active');
        setTimeout(() => inpTextField.focus(), 80);

        inpConfirmBtn.onclick = () => {
          const val = inpTextField.value.trim().toUpperCase();
          if (val) {
            currentRoom = val.slice(0, 12);
            localStorage.setItem(ROOM_KEY, currentRoom);
            roomCodeDisplay.textContent = currentRoom;
            initSignaling();
            showToast(`已切换至频道 CH // ${currentRoom}`);
          }
          closeInputModal();
        };
      });

      // ================== 7. 全局文件选择、拖拽与粘贴支持 ==================
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0 && activeTargetPeerId) {
          sendFilesToPeer(activeTargetPeerId, Array.from(e.target.files));
        }
      });

      const stageArea = document.getElementById('stageArea');
      stageArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        stageArea.classList.add('drag-active');
      });
      stageArea.addEventListener('dragleave', (e) => {
        if (e.target === stageArea) stageArea.classList.remove('drag-active');
      });
      stageArea.addEventListener('drop', (e) => {
        e.preventDefault();
        stageArea.classList.remove('drag-active');
        const list = Array.from(peers.values());
        if (list.length === 1 && e.dataTransfer.files.length > 0) {
          sendFilesToPeer(list[0].id, Array.from(e.dataTransfer.files));
        } else if (list.length > 1) {
          showToast('请将文件拖拽至具体的设备卡片上');
        } else {
          showToast('当前暂无在线设备');
        }
      });

      window.addEventListener('paste', (e) => {
        if (inputModal.classList.contains('active')) return;
        const list = Array.from(peers.values());
        if (list.length === 0) return;
        const targetId = activeTargetPeerId && peers.has(activeTargetPeerId) ? activeTargetPeerId : list[0].id;

        const items = e.clipboardData?.items;
        if (!items) return;

        const files = [];
        for (let i = 0; i < items.length; i++) {
          if (items[i].kind === 'file') {
            const f = items[i].getAsFile();
            if (f) files.push(f);
          }
        }
        if (files.length > 0) {
          sendFilesToPeer(targetId, files);
          return;
        }

        const text = e.clipboardData.getData('text');
        if (text) {
          sendTextToPeer(targetId, text);
        }
      });

      // 启动真实信令发现
      initSignaling();
    })();
  </script>
</body>
</html>
